name: CookieCamera
version: '1.1.0'
main: com.cookiecamera.CookieCamera
description: Cinematic camera cutscene plugin
api-version: '1.21'
folia-supported: true
dependencies:
  server:
    packetevents:
      required: true
      load: BEFORE
      join-classpath: true
authors:
  - AnkiTeam
permissions:
  cookiecamera.admin:
    description: Admin commands
    default: op
  cookiecamera.play:
    description: Play scenes
    default: op
  cookiecamera.play.other:
    description: Play scenes for other players
    default: op

